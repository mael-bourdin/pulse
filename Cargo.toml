[workspace]
resolver = "3"
members = ["crates/pulse-domain", "crates/pulse-api", "crates/auth-simulator"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false

[workspace.dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
rust_decimal = "1.43.0"
rust_decimal_macros = "1.40"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
